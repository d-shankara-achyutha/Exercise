<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="problems.js" defer></script>
    <title>JavaScript Practice</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: #1e2926;
            background: #f4f3ed;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at 88% 5%, #e8c9a8 0, transparent 25%), #f4f3ed;
        }

        main {
            width: min(100% - 40px, 980px);
            margin: 0 auto;
            padding: 56px 0 48px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #bd573b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 7vw, 64px);
            font-weight: 400;
            line-height: 1.05;
        }

        .intro {
            max-width: 720px;
            margin: 18px 0 26px;
            color: #53615b;
            font-size: 17px;
            line-height: 1.65;
        }

        .section-label {
            margin: 0 0 18px;
            color: #68746d;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .examples {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .example {
            min-width: 0;
            min-height: 230px;
            padding: 22px;
            border: 1px solid #deded5;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.68);
        }

        .example-number {
            display: block;
            margin-bottom: 14px;
            color: #bd573b;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
        }

        .example h2 {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .example-description {
            min-height: 42px;
            margin: 0;
            color: #68746d;
            font-size: 14px;
            line-height: 1.45;
        }

        .exercise-form { margin-top: 18px; }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }

        label {
            display: grid;
            min-width: 0;
            gap: 6px;
            color: #53615b;
            font-size: 12px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-width: 0;
            min-height: 40px;
            padding: 9px 10px;
            border: 1px solid #c9cec4;
            border-radius: 4px;
            background: #fff;
            color: #1e2926;
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #bd573b;
            outline-offset: 2px;
        }

        button {
            margin-top: 14px;
            padding: 10px 14px;
            border: 0;
            border-radius: 4px;
            background: #285b4b;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }

        button:hover { background: #1e493b; }
        button:focus-visible { outline: 2px solid #bd573b; outline-offset: 2px; }

        .result {
            min-height: 44px;
            margin: 12px 0 0;
            padding: 11px 12px;
            border-radius: 4px;
            background: #edf0e8;
            color: #68746d;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-line;
        }

        .result.has-result { color: #285b4b; font-weight: 700; }

        .note {
            margin: 14px 0 0;
            color: #68746d;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            main { width: min(100% - 28px, 980px); padding-top: 36px; }
            .intro { font-size: 15px; }
            .examples { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">A small JavaScript practice space</p>
        <h1>Try each problem yourself.</h1>
        <p class="intro">
            Enter values in an exercise box and run it to see what the JavaScript does.
            Try different inputs to explore how each result changes.
        </p>
        <p class="section-label">Choose an exercise</p>
        <section class="examples" id="exercise-cards" aria-label="JavaScript exercises"></section>
        <p class="note">For list exercises, enter values separated by commas.</p>
    </main>
</body>
</html>
