<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="problems.js" defer></script>
    <title>JavaScript Practice</title>
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f4f3ed;
            --page-glow: #e8c9a8;
            --text: #1e2926;
            --muted: #53615b;
            --soft-muted: #68746d;
            --accent: #bd573b;
            --card-bg: rgba(255, 255, 255, 0.68);
            --border: #deded5;
            --input-bg: #fff;
            --input-border: #c9cec4;
            --button-bg: #285b4b;
            --button-hover: #1e493b;
            --result-bg: #edf0e8;
            --result-strong: #285b4b;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--page-bg);
            font-synthesis: none;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --page-bg: #171d1a;
            --page-glow: #35443b;
            --text: #edf1ea;
            --muted: #c0cbc2;
            --soft-muted: #a0aea4;
            --accent: #f08a6c;
            --card-bg: rgba(35, 43, 39, 0.92);
            --border: #3d4942;
            --input-bg: #1d2521;
            --input-border: #536159;
            --button-bg: #39745f;
            --button-hover: #46866e;
            --result-bg: #29332d;
            --result-strong: #b7e2ca;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at 88% 5%, var(--page-glow) 0, transparent 25%), var(--page-bg);
        }

        main {
            width: min(100% - 40px, 1400px);
            margin: 0 auto;
            padding: 56px 0 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .eyebrow {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .theme-toggle {
            flex: 0 0 auto;
            margin: 0;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
        }

        .theme-toggle:hover { background: var(--result-bg); }
        .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 7vw, 64px);
            font-weight: 400;
            line-height: 1.05;
        }

        .intro {
            max-width: 720px;
            margin: 18px 0 26px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .section-label {
            margin: 0 0 18px;
            color: var(--soft-muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .examples {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
        }

        .example {
            min-width: 0;
            min-height: 230px;
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card-bg);
        }

        .example-number {
            display: block;
            margin-bottom: 14px;
            color: var(--accent);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
        }

        .example h2 {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .example-description {
            min-height: 42px;
            margin: 0;
            color: var(--soft-muted);
            font-size: 14px;
            line-height: 1.45;
        }

        .exercise-form { margin-top: 18px; }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
        }

        label {
            display: grid;
            min-width: 0;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-width: 0;
            min-height: 40px;
            padding: 9px 10px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        button {
            margin-top: 14px;
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            background: var(--button-bg);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }

        form button:hover { background: var(--button-hover); }
        form button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .result {
            min-height: 44px;
            margin: 12px 0 0;
            padding: 11px 12px;
            border-radius: 8px;
            background: var(--result-bg);
            color: var(--soft-muted);
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-line;
        }

        .result.has-result { color: var(--result-strong); font-weight: 700; }

        .note {
            margin: 14px 0 0;
            color: var(--soft-muted);
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 1100px) {
            .examples { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (max-width: 800px) {
            .examples { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 560px) {
            .examples { grid-template-columns: 1fr; gap: 16px; }
        }

        @media (max-width: 640px) {
            main { width: min(100% - 28px, 1400px); padding-top: 36px; }
            .intro { font-size: 15px; }
        }

        @media (max-width: 420px) {
            .topbar { align-items: flex-start; }
            .eyebrow { max-width: 190px; line-height: 1.5; }
            .theme-toggle { font-size: 11px; }
        }
    </style>
</head>
<body>
    <main>
        <div class="topbar">
            <p class="eyebrow">A small JavaScript practice space</p>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Switch to dark mode</button>
        </div>
        <h1>Try each problem yourself.</h1>
        <p class="intro">
            Enter values in an exercise box and run it to see what the JavaScript does.
            Try different inputs to explore how each result changes.
        </p>
        <p class="section-label">Choose an exercise</p>
        <section class="examples" id="exercise-cards" aria-label="JavaScript exercises"></section>
        <p class="note">For list exercises, enter values separated by commas.</p>
    </main>
</body>
</html>
